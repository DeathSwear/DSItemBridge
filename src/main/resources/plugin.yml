name: DSItemBridge
version: 1.0.1
main: ru.deathswear.dsitembridge.DSItemBridge
api-version: 1.21
author: DeathSwear
description: Bridge between item acquisition (looting/crafting), recipe unlocking, and PremiumAdvancements
softdepend: [MythicMobs, MythicCrucible, PremiumAdvancements]

commands:
  dsbridge:
    description: DSItemBridge admin command
    permission: dsitembridge.admin
    usage: /dsbridge [reload|check]

permissions:
  dsitembridge.admin:
    description: Allows reloading and checking DSItemBridge
    default: op
