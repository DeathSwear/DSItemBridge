# ========================================================
# DSItemBridge - Configuration
# Bridge between Item Acquisition, Recipe Discovery & Advancements
# ========================================================

settings:
  # Enable detailed logging in console
  debug: false

  # Notification when a new recipe is unlocked
  notifications:
    sound:
      enabled: true
      type: "ENTITY_PLAYER_LEVELUP"
      volume: 0.5
      pitch: 2.0
    actionbar:
      enabled: true
      message: "&a✦ Открыт новый рецепт крафта!"
    chat:
      enabled: false
      message: "&a[+] Открыт новый рецепт: &f%recipe%"

# --------------------------------------------------------
# CRAFT ADVANCEMENTS
# Format:
#   <MYTHIC_ITEM_ID or VANILLA_MATERIAL>: "<advancement_id>"
#   or list of advancements:
#     - "<advancement_1>"
#     - "<advancement_2>"
#
# When a player crafts this item (regular or shift-click),
# the advancement will be automatically granted via
# "/padv give <player> <advancement_id> --silent"
# --------------------------------------------------------
craft-advancements:
  # Tools & Artifacts
  ThrowingTorch: "craft_throwing_torch"
  SharpFlintArtefact: "craft_sharp_flint"
  MinerHelperArtefact: "craft_miner_lantern"
  BuilderHelperArtefact: "craft_builder_talisman"
  UniversalKey: "craft_universal_key"
  GlassTotem: "craft_glass_totem"
  HeartArtefact: "craft_heart_artefact"
  DivineEssence: "craft_divine_essence"

  # Weapons & Armor
  IronSpear: "craft_iron_spear"
  SharpedWeirdBone: "craft_sharped_bone"
  BoneSword: "craft_bone_sword"
  PressedBoneBlock: "craft_pressed_bone"
  BerserkBoneAxe: "craft_berserk_axe"
  PoisonIronSword: "craft_poison_sword"
  DeathSwordArtefact: "craft_rogue_daggers"
  LeftHandSwordArtefact: "craft_rogue_daggers"
  ShadowBlade: "craft_shadow_blade"
  IronScythe: "craft_iron_scythe"
  DiamondScythe: "craft_diamond_scythe"
  SoulCollectDamageScythe: "craft_soul_scythe"
  SoulLantern: "craft_soul_lantern"
  FrostSword: "craft_frost_sword"
  PermafrostBlade: "craft_permafrost_blade"
  VenomStinger: "craft_venom_stinger"
  WidowHeart: "craft_widow_heart"
  CataclysmAxe: "craft_cataclysm_axe"
  MalphiteChestplate: "craft_malphite_chestplate"
  ShadeBag: "craft_shade_bag"
  ShadeCloak: "craft_shade_cloak"

  # Staffs & Magic
  AmethystStick: "craft_amethyst_stick"
  PetsHelperStaff: "craft_pets_staff"
  GreenDeathMageStaff: "craft_lich_staff"
  MysticSpear: "craft_mystic_spear"
  BigBonesStaff: "craft_big_bones_staff"
  HeartAmulet: "craft_heart_amulet"
  FireSpiritPotion: "craft_fire_potion"
  WindFeather: "craft_wind_feather"
  Airplane: "craft_airplane"
  SuperAirplane: "craft_airplane"

  # Summons
  SummonHeart: "craft_summon_heart"
  SpiderMotherSummon: "craft_spider_mother_summon"
  TrollBossSummon: "craft_troll_summon"
  ShadeSummon: "craft_shade_summon"
  BigBonesSummon: "craft_big_bones_summon"
  IceKingBonesSummon: "craft_ice_king_summon"

# --------------------------------------------------------
# ACQUIRE ADVANCEMENTS
# Format:
#   <MYTHIC_ITEM_ID or VANILLA_MATERIAL>: "<advancement_id>"
#   or list of advancements:
#     - "<advancement_1>"
#     - "<advancement_2>"
#
# When a player acquires this item by ANY means (chest,
# drop, trade, floor pickup, craft), the advancement is granted.
# --------------------------------------------------------
acquire-advancements:
  TrollMace: "weapon_troll_mace"
  BasicRune:
    - "magic_root"
    - "rune_basic"
  DarkRune: "rune_dark"
  FireRune: "rune_fire"
  FrostRune: "rune_frost"
  WindRune: "rune_wind"
  VenomRune: "rune_venom"
  ShadeRune: "rune_shade"
  Necromancer_SummonSkull: "rune_necro_skull"
  ShadowTPRune: "rune_shadow_tp"
  AngelHeartsRune: "rune_angel"

